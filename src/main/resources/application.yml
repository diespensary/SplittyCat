spring:
  application:
    name: SplittyCat

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

app:
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN}
    init-data-max-age-seconds: 86400
    webhook-url: ${TELEGRAM_WEBHOOK_URL:}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
