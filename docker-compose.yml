services:
  db:
    image: postgres:16
    container_name: splittycat-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: splittycat
      POSTGRES_USER: splittycat
      POSTGRES_PASSWORD: splittycat
    ports:
      - "5432:5432"
    volumes:
      - splittycat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splittycat -d splittycat"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: splittycat-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  splittycat_pgdata:
