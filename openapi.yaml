openapi: 3.0.3
info:
  title: SplittyCat API
  version: 0.1.0
  description: |
    REST API для управления событиями, участниками и расходами.
    Аутентификация в реальном приложении — Telegram Mini App initData (TMA).
servers:
  - url: http://localhost:8080
    description: Local

tags:
  - name: Events
  - name: Join
  - name: Participants
  - name: Expenses
  - name: Balance

paths:
  /api/events:
    post:
      tags: [Events]
      summary: Create event
      security:
        - TMAAuthorization: []
        - TMAInitDataHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
            examples:
              example:
                value:
                  title: Trip
      responses:
        "200":
          description: Event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDto"
              examples:
                example:
                  value:
                    id: 10
                    title: Trip
                    inviteCode: ABCDEF
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

    get:
      tags: [Events]
      summary: List events available for current user
      security:
        - TMAAuthorization: []
        - TMAInitDataHeader: []
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventDto"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/events/{eventId}:
    get:
      tags: [Events]
      summary: Get event by id
      security:
        - TMAAuthorization: []
        - TMAInitDataHeader: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDto"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Events]
      summary: Delete event (owner only)
      security:
        - TMAAuthorization: []
        - TMAInitDataHeader: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/events/join:
    post:
      tags: [Join]
      summary: Start join by inviteCode
      security:
        - TMAAuthorization: []
        - TMAInitDataHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRequestBody"
            examples:
              example:
                value:
                  inviteCode: INVXYZ
      responses:
        "200":
          description: Join info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinResponse"
              examples:
                notJoined:
                  value:
                    eventId: 3
                    title: Meetup
                    inviteCode: INVXYZ
                    alreadyJoined: false
                    myParticipantId: null
                    unlinkedParticipants:
                      - id: 11
                        name: Bob
                        linked: false
                      - id: 12
                        name: Charlie
                        linked: false
                alreadyJoined:
                  value:
                    eventId: 4
                    title: Party
                    inviteCode: INVABC
                    alreadyJoined: true
                    myParticipantId: 99
                    unlinkedParticipants: []
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/events/join/claim:
    post:
      tags: [Join]
      summary: Claim participant (link participant to current user)
      security:
        - TMAAuthorization: []
        - TMAInitDataHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimRequestBody"
            examples:
              example:
                value:
                  inviteCode: INVXYZ
                  participantId: 12
      responses:
        "200":
          description: Event after successful claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDto"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/events/{eventId}/my-balance:
    get:
      tags: [Balance]
      summary: Get current user's balance inside event
      security:
        - TMAAuthorization: []
        - TMAInitDataHeader: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Balance response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceResponse"
              examples:
                example:
                  value:
                    myParticipantId: 1
                    youOwe:
                      - participantId: 2
                        participantName: Bob
                        currencyCode: EUR
                        amount: 10.00
                    oweYou:
                      - participantId: 3
                        participantName: Carol
                        currencyCode: EUR
                        amount: 5.00
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/events/{eventId}/participants:
    get:
      tags: [Participants]
      summary: List participants of event
      security:
        - TMAAuthorization: []
        - TMAInitDataHeader: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: List of participants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ParticipantDto"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      tags: [Participants]
      summary: Add participant to event
      security:
        - TMAAuthorization: []
        - TMAInitDataHeader: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateParticipantRequest"
            examples:
              example:
                value:
                  name: Dave
      responses:
        "200":
          description: Created participant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/events/{eventId}/participants/{participantId}:
    delete:
      tags: [Participants]
      summary: Delete participant (owner or creator)
      security:
        - TMAAuthorization: []
        - TMAInitDataHeader: []
      parameters:
        - $ref: "#/components/parameters/EventId"
        - $ref: "#/components/parameters/ParticipantId"
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/events/{eventId}/expenses:
    get:
      tags: [Expenses]
      summary: List expenses of event
      security:
        - TMAAuthorization: []
        - TMAInitDataHeader: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: List of expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpenseSummaryDto"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      tags: [Expenses]
      summary: Create expense
      security:
        - TMAAuthorization: []
        - TMAInitDataHeader: []
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExpenseRequest"
            examples:
              example:
                value:
                  title: Lunch
                  amount: 15.00
                  currencyCode: USD
                  expenseDate: "2024-02-01"
                  payerParticipantId: 5
                  shares:
                    - participantId: 5
                      amount: 15.00
                      description: null
      responses:
        "200":
          description: Created expense (summary)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseSummaryDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/events/{eventId}/expenses/{expenseId}:
    get:
      tags: [Expenses]
      summary: Get expense details
      security:
        - TMAAuthorization: []
        - TMAInitDataHeader: []
      parameters:
        - $ref: "#/components/parameters/EventId"
        - $ref: "#/components/parameters/ExpenseId"
      responses:
        "200":
          description: Expense detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseDetailDto"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Expenses]
      summary: Delete expense (owner/creator/payer)
      security:
        - TMAAuthorization: []
        - TMAInitDataHeader: []
      parameters:
        - $ref: "#/components/parameters/EventId"
        - $ref: "#/components/parameters/ExpenseId"
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    TMAAuthorization:
      type: apiKey
      in: header
      name: Authorization
      description: 'Telegram Mini App initData as: Authorization: "TMA <initData>"'
    TMAInitDataHeader:
      type: apiKey
      in: header
      name: X-TMA-Init-Data
      description: "Alternative way to pass Telegram Mini App initData"

  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ParticipantId:
      name: participantId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ExpenseId:
      name: expenseId
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      description: Generic error body (Spring may include additional fields)
      properties:
        message:
          type: string
      example:
        message: "Event not found"

    CreateEventRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
      example:
        title: Trip

    EventDto:
      type: object
      required: [id, title, inviteCode]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        inviteCode:
          type: string
      example:
        id: 10
        title: Trip
        inviteCode: ABCDEF

    JoinRequestBody:
      type: object
      required: [inviteCode]
      properties:
        inviteCode:
          type: string
      example:
        inviteCode: INVXYZ

    ClaimRequestBody:
      type: object
      required: [inviteCode, participantId]
      properties:
        inviteCode:
          type: string
        participantId:
          type: integer
          format: int64
      example:
        inviteCode: INVXYZ
        participantId: 12

    ParticipantDto:
      type: object
      required: [id, name, linked]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        linked:
          type: boolean
      example:
        id: 11
        name: Bob
        linked: false

    JoinResponse:
      type: object
      required: [eventId, title, inviteCode, alreadyJoined, unlinkedParticipants]
      properties:
        eventId:
          type: integer
          format: int64
        title:
          type: string
        inviteCode:
          type: string
        alreadyJoined:
          type: boolean
        myParticipantId:
          type: integer
          format: int64
          nullable: true
        unlinkedParticipants:
          type: array
          items:
            $ref: "#/components/schemas/ParticipantDto"

    BalanceEntryDto:
      type: object
      required: [participantId, participantName, currencyCode, amount]
      properties:
        participantId:
          type: integer
          format: int64
        participantName:
          type: string
        currencyCode:
          type: string
        amount:
          type: number
      example:
        participantId: 2
        participantName: Bob
        currencyCode: EUR
        amount: 10.00

    BalanceResponse:
      type: object
      required: [myParticipantId, youOwe, oweYou]
      properties:
        myParticipantId:
          type: integer
          format: int64
        youOwe:
          type: array
          items:
            $ref: "#/components/schemas/BalanceEntryDto"
        oweYou:
          type: array
          items:
            $ref: "#/components/schemas/BalanceEntryDto"

    CreateParticipantRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
      example:
        name: Dave

    ShareDto:
      type: object
      required: [participantId, amount]
      properties:
        participantId:
          type: integer
          format: int64
        amount:
          type: number
        description:
          type: string
          nullable: true
      example:
        participantId: 5
        amount: 15.00
        description: null

    CreateExpenseRequest:
      type: object
      required: [title, amount, currencyCode, expenseDate, payerParticipantId, shares]
      properties:
        title:
          type: string
          minLength: 1
        amount:
          type: number
        currencyCode:
          type: string
          minLength: 1
        expenseDate:
          type: string
          format: date
        payerParticipantId:
          type: integer
          format: int64
        shares:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ShareDto"

    ExpenseSummaryDto:
      type: object
      required: [id, title, amount, currencyCode, expenseDate, payerName]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        amount:
          type: number
        currencyCode:
          type: string
        expenseDate:
          type: string
          format: date
        payerName:
          type: string

    ExpenseDetailDto:
      type: object
      required: [id, title, amount, currencyCode, expenseDate, payer, shares]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        amount:
          type: number
        currencyCode:
          type: string
        expenseDate:
          type: string
          format: date
        payer:
          $ref: "#/components/schemas/ParticipantDto"
        shares:
          type: array
          items:
            $ref: "#/components/schemas/ShareDto"
